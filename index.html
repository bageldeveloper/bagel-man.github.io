<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Bagels!</title>

  <link rel="icon" href="bagelcomicsicon.png">

  <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-4474724430572739"
     crossorigin="anonymous"></script>

  <link rel="stylesheet" href="css/main.css">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600&display=swap" rel="stylesheet">

  <script src="https://code.jquery.com/jquery-3.7.0.js"></script>
  <script src="./gamesinfo.js"></script>
</head>

<body>
  <header class="topbar">
    <div class="logo-area">
      <img src="bagelicontab.png" alt="Bagel">
    </div>

<div class="topbar-center">
    <div class="search-wrapper">

  <input id="searchInput" placeholder="search games...">
  <div id="searchIcon" class="search-icon">🔍</div>
  <div id="searchSuggestions" class="search-suggestions"></div>
  </div>
</div>

    <nav class="topbar-right">
      <a href="index.html"><button class="selected">Games</button></a>
      <a href="chat.html"><button>Chat</button></a>
      <a href="projects.html"><button>Projects</button></a>
      <a href="about.html"><button>About</button></a>
    </nav>
  </header>

  <div class="layout">

    <!-- SIDEBAR (MANUAL = CLEAN) -->
    <aside class="sidebar">
      <div class="game-categories">

        <button class="active" data-genre="all">🎮 All Games</button>
        <button data-genre="favorite">⭐ Favorites</button>
        <button data-genre="adventure">🧭 Adventure</button>
        <button data-genre="puzzle">🧩 Puzzle</button>
        <button data-genre="simulation">🖥️ Simulation</button>
        <button data-genre="shooter">🔫 Shooter</button>
        <button data-genre="towerDefense">🏰 Tower Defense</button>
        <button data-genre="racing">🏎️ Racing</button>
        <button data-genre="sports">🏀 Sports</button>
        <button data-genre="action">⚔️ Action</button>
        <button data-genre="platformer">🕹️ Platformer</button>
        <button data-genre="strategy">🧠 Strategy</button>

      </div>
    </aside>

    <!-- MAIN -->
    <main class="main-content">

      <h1 id="pageTitle">All Games</h1>


      <section id="gameGrid" class="card-grid"></section>

      <section id="genreRows"></section>

    </main>

  </div>

  <script src="js/main.js"></script>
</body>
</html>
