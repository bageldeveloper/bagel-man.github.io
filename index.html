<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-STZFN2TW1E"></script>
    
    <title>Bagels!</title>

    <meta
        name="description"
        content="Play hundreds of free unblocked games online at Bagel Comics!!!"
    >

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1"
    >

    <link rel="canonical" href="https://bagelcomics.com/">

    <!-- Open Graph -->
    <meta
        property="og:title"
        content="Bagel Comics – Play Free Unblocked Games Online"
    >
    <meta
        property="og:description"
        content="Play hundreds of free unblocked games online at Bagel Comics!!!"
    >
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://bagelcomics.com/">
    <meta
        property="og:image"
        content="https://bagelcomics.com/icon_256.png"
    >

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image">
    <meta
        name="twitter:title"
        content="Bagel Comics – Play Free Unblocked Games Online"
    >
    <meta
        name="twitter:description"
        content="Play hundreds of free unblocked games online at Bagel Comics!!!"
    >
    <meta
        name="twitter:image"
        content="https://bagelcomics.com/icon_256.png"
    >

    <link rel="icon" href="bagelcomicsicon.png">

    <link rel="stylesheet" href="css/main.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link
        href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800;900&display=swap"
        rel="stylesheet"
    >

    <script src="https://cdn.scaledrone.com/scaledrone.min.js"></script>
    <script src="https://code.jquery.com/jquery-3.7.0.js"></script>
    <script src="./gamesinfo.js?v=20260824"></script>
</head>

<body>

    <!-- =========================================================
         TOP BAR
         ========================================================= -->

    <header class="topbar">

        <div class="logo-area">
            <img
                src="bagelicontab.png"
                alt="Bagel"
            >
        </div>

        <div class="topbar-center">

            <div class="search-wrapper">

                <input
                    id="searchInput" aria-label="Search games"
                    placeholder="search games..."
                    autocomplete="off"
                >

                <button id="searchIcon" class="search-icon" type="button" aria-label="Search games">
                    <img
                        src="images/icons/search.png"
                        alt="Search"
                    >
                </button>

                <div
                    id="searchSuggestions" aria-live="polite"
                    class="search-suggestions"
                ></div>

            </div>

        </div>

        <nav class="topbar-right">

            <button
                id="chat-toggle-btn"
                onclick="toggleChat()"
                aria-label="Open chat"
            >
                <img
                    class="icons"
                    src="images/icons/chat.png"
                    alt=""
                >
                <span id="online-count">0</span>
            </button>

            <button
                id="announce-btn"
                onclick="toggleAnnouncePanel()"
                aria-label="Announcements"
            >
                <img
                    class="icons"
                    src="images/icons/announcements.png"
                    alt=""
                >
                <span id="announce-dot"></span>
            </button>

            <a
                href="https://www.instagram.com/bagelcomicsofficial/"
                target="_blank"
                rel="noopener noreferrer"
                aria-label="Instagram"
            >
                <img
                    class="icons"
                    src="images/icons/insta.png"
                    alt=""
                >
            </a>

            <button
                onclick="toggleSettings()"
                aria-label="Settings"
            >
                <img
                    class="icons"
                    src="images/icons/settings.png"
                    alt=""
                >
            </button>

        </nav>

    </header>


    <!-- =========================================================
         ANNOUNCEMENT PANEL
         ========================================================= -->

    <div id="announce-panel">

        <div class="ann-tabs">

            <button
                class="ann-tab active"
                id="tab-new"
                onclick="switchAnnTab('new')"
            >
                New
            </button>

            <button
                class="ann-tab"
                id="tab-all"
                onclick="switchAnnTab('all')"
            >
                All
            </button>

        </div>

        <!-- NEW -->
        <div
            class="ann-pane active"
            id="pane-new"
        >
            <div id="ann-new-content"></div>
        </div>

        <!-- ALL -->
        <div
            class="ann-pane"
            id="pane-all"
        >
            <div id="ann-all-list"></div>
        </div>

    </div>


    <!-- =========================================================
         SETTINGS PANEL
         ========================================================= -->

    <div id="settings-panel" role="dialog" aria-modal="false" aria-labelledby="settings-title" aria-hidden="true">

        <div class="settings-title" id="settings-title">
            Settings
        </div>

        <div class="settings-row">

            <label for="toggle-light">
                Light mode
                <span class="sub">
                    Activate to burn your eyes
                </span>
            </label>

            <label class="toggle">

                <input
                    type="checkbox"
                    id="toggle-light"
                    onchange="applyLightMode(this.checked)"
                >

                <div class="toggle-track"></div>
                <div class="toggle-thumb"></div>

            </label>

        </div>

        <hr class="settings-divider">

        <div class="settings-row">

            <label for="toggle-ads">
                Block ads
                <span class="sub">
                    Hides AdSense scripts & slots
                </span>
            </label>

            <label class="toggle">

                <input
                    type="checkbox"
                    id="toggle-ads"
                    onchange="applyAdBlock(this.checked)"
                >

                <div class="toggle-track"></div>
                <div class="toggle-thumb"></div>

            </label>

        </div>

    </div>


    <!-- =========================================================
         CHAT PANEL
         ========================================================= -->

    <div id="chat-panel">

        <div class="chat-panel-header">

            <div>

                <h3>Chat</h3>

                <span
                    class="members-count-inline"
                    id="panel-member-count"
                >
                    connecting...
                </span>

            </div>

            <button
                class="chat-panel-close"
                onclick="toggleChat()"
                aria-label="Close chat"
            >
                ✖
            </button>

        </div>


        <!-- MEMBERS -->

        <div
            class="chat-panel-members"
            id="panel-members-list"
        ></div>


        <!-- MESSAGES -->

        <div
            class="chat-panel-messages"
            id="panel-messages"
        ></div>


        <!-- PROFILE -->

        <div id="profile-panel">

            <button
                class="profiletoggle"
                onclick="toggleProfile()"
            >
                Profile
            </button>

            <div
                id="profile-content"
                class="profile-content collapsed"
            >

                <div class="chat-profile-preview">

                    <span id="profile-preview-name"></span>

                </div>

                <div class="profile-row">

                    <input
                        id="profile-name-input" aria-label="Display name"
                        maxlength="30"
                        placeholder="your name"
                        oninput="refreshProfilePreview()"
                    >

                    <input
                        id="profile-color-input" aria-label="Display color"
                        type="color"
                        oninput="refreshProfilePreview()"
                    >

                    <button onclick="saveProfile()">
                        Save
                    </button>

                </div>

            </div>

        </div>


        <!-- INPUT -->

        <form
            class="chat-panel-form"
            id="panel-form"
        >

            <input
                id="panel-input" aria-label="Chat message"
                placeholder="Say something..."
                maxlength="100"
            >

            <button type="submit">
                Send
            </button>

        </form>

    </div>


    <!-- =========================================================
         MAIN LAYOUT
         ========================================================= -->

    <div class="layout">

        <!-- SIDEBAR -->

        <aside class="sidebar">

            <div class="game-categories">

                <button
                    class="active"
                    data-genre="all"
                >
                    <img
                        class="gameicon"
                        src="images/icons/home.png"
                        alt=""
                    >
                    Home
                </button>

                <button data-genre="favorite">
                    <img
                        class="gameicon"
                        src="images/icons/favorites.png"
                        alt=""
                    >
                    Favorites
                </button>

                <button data-genre="adventure">
                    <img
                        class="gameicon"
                        src="images/icons/adventure.png"
                        alt=""
                    >
                    Adventure
                </button>

                <button data-genre="puzzle">
                    <img
                        class="gameicon"
                        src="images/icons/puzzle.png"
                        alt=""
                    >
                    Puzzle
                </button>

                <button data-genre="simulation">
                    <img
                        class="gameicon"
                        src="images/icons/simulation.png"
                        alt=""
                    >
                    Simulation
                </button>

                <button data-genre="shooter">
                    <img
                        class="gameicon"
                        src="images/icons/shooter.png"
                        alt=""
                    >
                    Shooter
                </button>

                <button data-genre="towerDefense">
                    <img
                        class="gameicon"
                        src="images/icons/tower.png"
                        alt=""
                    >
                    Tower Defense
                </button>

                <button data-genre="racing">
                    <img
                        class="gameicon"
                        src="images/icons/racing.png"
                        alt=""
                    >
                    Racing
                </button>

                <button data-genre="sports">
                    <img
                        class="gameicon"
                        src="images/icons/sports.png"
                        alt=""
                    >
                    Sports
                </button>

                <button data-genre="action">
                    <img
                        class="gameicon"
                        src="images/icons/action.png"
                        alt=""
                    >
                    Action
                </button>

                <button data-genre="platformer">
                    <img
                        class="gameicon"
                        src="images/icons/platformer.png"
                        alt=""
                    >
                    Platformer
                </button>

                <button data-genre="strategy">
                    <img
                        class="gameicon"
                        src="images/icons/strategy.png"
                        alt=""
                    >
                    Strategy
                </button>

                <button data-genre="original">
                    <img
                        class="gameicon"
                        src="images/icons/originals.png"
                        alt=""
                    >
                    Original
                </button>

                <button data-genre="allGames">
                    All Games
                </button>

            </div>

        </aside>


        <!-- MAIN CONTENT -->

        <main class="main-content">

            <h1 id="pageTitle">
                Home
            </h1>

            <section
                id="gameGrid"
                class="card-grid"
            ></section>

            <section
                id="genreRows"
            ></section>

        </main>

    </div>


    <!-- =========================================================
         SCRIPTS
         ========================================================= -->

    <script src="announcements.js"></script>
    <script src="js/main.js?v=20260824"></script>
    <script src="chatscript.js?v=20260824"></script>

  <script src="js/settings.js?v=20260824"></script>
</body>
</html>
