<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Bagels Chat</title>

  <!-- MAIN SITE CSS (header etc) -->
  <link rel="stylesheet" href="css/main.css">
  <!-- CHAT SPECIFIC CSS -->
  <link rel="stylesheet" href="css/chat.css">

  <script src="https://cdn.scaledrone.com/scaledrone.min.js"></script>
  <script src="https://code.jquery.com/jquery-3.7.0.js"></script>
</head>

<body>
  <!-- TOP BAR (same as index.html) -->
  <header class="topbar">
    <div class="logo-area">
      <a href="index.html"><img src="bagelicontab.png" alt="Bagel"></a>
    </div>

    <div class="topbar-center">
    </div>

    <nav class="topbar-right">
      <a href="chat.html">Chat</a>
      <a href="projects.html">Projects</a>
      <a href="about.html">About</a>
    </nav>
  </header>

  <!-- CHAT PAGE -->
  <div class="chat-page">
    <h1 class="pedro">Chat</h1>

    <div class="chat-layout">
      <!-- MEMBERS LIST -->
      <aside class="members-sidebar">
        <h3><span class="members-count">-</span></h3>
        <div class="members-list">-</div>
      </aside>

      <!-- CHAT MAIN -->
      <main class="chat-main">
        <div class="messages"></div>

        <form class="message-form" onsubmit="return false;">
          <input class="message-form__input" placeholder="Say something..." type="text">
          <button class="message-form__send" type="submit">Send</button>
        </form>
      </main>
    </div>
  </div>

  <script src="./chatscript.js"></script>
</body>
</html>
